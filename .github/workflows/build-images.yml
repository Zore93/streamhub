name: Build & push Docker images

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "deploy/migrate/out/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}
  IMAGE_REPO: ${{ github.event.repository.name }}

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: backend
            dockerfile: deploy/Dockerfile.backend
          - target: frontend
            dockerfile: deploy/Dockerfile.frontend
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute lowercase tag
        id: t
        run: echo "tag=$(echo ${IMAGE_OWNER}/${IMAGE_REPO} | tr 'A-Z' 'a-z')-${{ matrix.target }}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.t.outputs.tag }}:latest
            ${{ env.REGISTRY }}/${{ steps.t.outputs.tag }}:${{ github.sha }}
          build-args: |
            REACT_APP_BACKEND_URL=https://${{ vars.PUBLIC_DOMAIN || 'example.com' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
