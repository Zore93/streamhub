services:
  mongo:
    image: mongo:7
    container_name: sh-mongo
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 20
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    volumes:
      - mongo_data:/data/db
    ports:
      - "127.0.0.1:27017:27017"   # bind to localhost ONLY (Navicat via SSH tunnel)

  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    # For faster installs, pull the prebuilt image from GHCR by removing the
    # `build:` block above and uncommenting the line below (set GHCR_OWNER in .env):
    #   image: ghcr.io/${GHCR_OWNER}/streamhub-backend:latest
    container_name: sh-backend
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      MONGO_URL: "mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongo:27017/${DB_NAME}?authSource=admin"
      DB_NAME: ${DB_NAME}
      CORS_ORIGINS: "https://${DOMAIN}"
      STRIPE_API_KEY: ${STRIPE_API_KEY}
      UPLOAD_DIR: /app/uploads
    volumes:
      - ${UPLOAD_DIR}:/app/uploads
      # Mount the host repository (so the backend can git pull) + docker socket
      # (so it can trigger a docker-compose rebuild on "Update" click). Read-only
      # bind mount is intentional — only the .git pull operation needs write access
      # which we promote via a separate writable mount below.
      - /opt/streamhub:/host_app
      - /var/run/docker.sock:/var/run/docker.sock

  frontend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
      args:
        REACT_APP_BACKEND_URL: "https://${DOMAIN}"
    # Or use the prebuilt image:
    #   image: ghcr.io/${GHCR_OWNER}/streamhub-frontend:latest
    container_name: sh-frontend
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: sh-nginx
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/streamhub.conf:/etc/nginx/conf.d/streamhub.conf:ro
      - ./nginx/ssl-params.conf:/etc/nginx/conf.d/ssl-params.conf:ro
      - letsencrypt:/etc/letsencrypt
      - certbot_www:/var/www/certbot

  certbot:
    image: certbot/certbot:latest
    container_name: sh-certbot
    restart: unless-stopped
    entrypoint: /bin/sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet --deploy-hook 'nginx -s reload'; sleep 12h; done"
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot_www:/var/www/certbot

volumes:
  mongo_data:
  letsencrypt:
  certbot_www:
